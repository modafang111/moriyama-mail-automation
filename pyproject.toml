[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moriyama-mail-automation"
version = "0.1.0"
description = "Windows helper for semi-automated newsletter delivery (Google Drive + MyASP)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.140.0",
  "google-auth-oauthlib>=1.2.0",
  "google-auth-httplib2>=0.2.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
moriyama-mail = "moriyama_mail.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
